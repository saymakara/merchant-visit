<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D5C">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>Merchant Visit Activity</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Merchant Visit">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Merchant Visit">
<link rel="stylesheet" href="launcher.css">
<!--
  MERCHANT VISIT ACTIVITY - LAUNCHER PAGE (GitHub Pages edition)
  Opens the Apps Script form inside this page (no Google banner) and passes Telegram's location to it.
  The ONLY file to edit is config.js (the Web app link).
  No inline scripts or styles: the Content-Security-Policy above allows only the files in this folder.
  This repository is PUBLIC: never put the bot token, PINs, staff lists or merchant data here.
-->
<script src="boot.js"></script>
<script src="config.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="ld" id="ld" aria-hidden="true"><span class="sp"></span></div>
<iframe id="app" title="Merchant Visit Activity" allow="geolocation *; clipboard-read *; clipboard-write *; web-share *"></iframe>
<div class="nt hidden" id="nt" role="alert">
  <b id="ntT">Taking longer than usual</b>
  <span id="ntS">The form is still loading. Check the internet connection, then try again.</span>
  <button type="button" id="ntBtn">Try again</button>
</div>
<script src="launcher.js"></script>
</body>
</html>
